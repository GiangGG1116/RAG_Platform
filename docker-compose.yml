# ============================================================
# RAG Microservice Platform - Docker Compose
# ============================================================
version: "3.9"

x-common-env: &common-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: rag_platform
  POSTGRES_USER: rag_user
  POSTGRES_PASSWORD: rag_secret_password
  REDIS_HOST: redis
  REDIS_PORT: 6379
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: rag_user
  RABBITMQ_PASSWORD: rag_secret_password
  LLM_PROVIDER: local
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  LOG_LEVEL: INFO
  LOG_FORMAT: json

services:
  # ── Infrastructure ─────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag_platform
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sh:/docker-entrypoint-initdb.d/init_db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    networks:
      - rag-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - rag-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: rag_user
      RABBITMQ_DEFAULT_PASS: rag_secret_password
    ports:
      - "5672:5672"
      - "15672:15672"    # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - rag-network

  # ── Application Services ───────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: api-gateway
      INGESTION_SERVICE_URL: http://ingestion:8001
      RETRIEVAL_SERVICE_URL: http://retrieval:8002
      LLM_SERVICE_URL: http://llm-service:8003
      API_KEYS: default-api-key-change-me
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      ingestion:
        condition: service_healthy
      retrieval:
        condition: service_healthy
      llm-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - rag-network

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: ingestion-service
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - rag-network

  retrieval:
    build:
      context: .
      dockerfile: services/retrieval/Dockerfile
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: retrieval-service
      LLM_SERVICE_URL: http://llm-service:8003
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - rag-network

  llm-service:
    build:
      context: .
      dockerfile: services/llm_service/Dockerfile
    environment:
      <<: *common-env
      # OTEL_SERVICE_NAME: llm-service
      # OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder}
      LLM_PROVIDER: openai 
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8003:8003"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - rag-network

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      <<: *common-env
      OTEL_SERVICE_NAME: worker-service
      LLM_SERVICE_URL: http://llm-service:8003
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      llm-service:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - rag-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - rag-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  rag-network:
    driver: bridge
