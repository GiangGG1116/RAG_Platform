apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ include "rag-platform.namespace" . }}
  labels:
    {{- include "rag-platform.componentLabels" (dict "component" "api-gateway" "context" .) | nindent 4 }}
spec:
  type: {{ .Values.apiGateway.service.type }}
  selector:
    {{- include "rag-platform.selectorLabels" (dict "component" "api-gateway") | nindent 4 }}
  ports:
    - port: {{ .Values.apiGateway.service.port }}
      targetPort: {{ .Values.apiGateway.port }}
      protocol: TCP
