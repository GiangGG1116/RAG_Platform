{{- if .Values.ingestion.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingestion-hpa
  namespace: {{ include "rag-platform.namespace" . }}
  labels:
    {{- include "rag-platform.componentLabels" (dict "component" "ingestion" "context" .) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ingestion
  minReplicas: {{ .Values.ingestion.hpa.minReplicas }}
  maxReplicas: {{ .Values.ingestion.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.ingestion.hpa.targetCPUUtilization }}
    {{- if .Values.ingestion.hpa.targetMemoryUtilization }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.ingestion.hpa.targetMemoryUtilization }}
    {{- end }}
{{- end }}
