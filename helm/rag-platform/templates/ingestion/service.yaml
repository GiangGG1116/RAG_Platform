apiVersion: v1
kind: Service
metadata:
  name: ingestion
  namespace: {{ include "rag-platform.namespace" . }}
  labels:
    {{- include "rag-platform.componentLabels" (dict "component" "ingestion" "context" .) | nindent 4 }}
spec:
  type: {{ .Values.ingestion.service.type }}
  selector:
    {{- include "rag-platform.selectorLabels" (dict "component" "ingestion") | nindent 4 }}
  ports:
    - port: {{ .Values.ingestion.service.port }}
      targetPort: {{ .Values.ingestion.port }}
