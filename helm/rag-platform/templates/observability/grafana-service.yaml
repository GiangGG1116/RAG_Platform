{{- if .Values.observability.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ include "rag-platform.namespace" . }}
  labels:
    {{- include "rag-platform.componentLabels" (dict "component" "grafana" "context" .) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "rag-platform.selectorLabels" (dict "component" "grafana") | nindent 4 }}
  ports:
    - port: 3000
      targetPort: 3000
{{- end }}
