{{- if .Values.observability.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: {{ include "rag-platform.namespace" . }}
  labels:
    {{- include "rag-platform.componentLabels" (dict "component" "otel-collector" "context" .) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "rag-platform.selectorLabels" (dict "component" "otel-collector") | nindent 4 }}
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: prometheus
      port: 8889
      targetPort: 8889
{{- end }}
