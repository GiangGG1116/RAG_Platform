# ============================================================
# PodDisruptionBudgets - Ensure availability during node drain
# ============================================================

{{- if .Values.apiGateway.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: {{ include "rag-platform.namespace" . }}
  labels:
    {{- include "rag-platform.componentLabels" (dict "component" "api-gateway" "context" .) | nindent 4 }}
spec:
  minAvailable: {{ .Values.apiGateway.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "rag-platform.selectorLabels" (dict "component" "api-gateway") | nindent 6 }}
{{- end }}
---
