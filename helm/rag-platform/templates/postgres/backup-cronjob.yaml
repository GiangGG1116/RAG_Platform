{{- if .Values.postgres.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: {{ include "rag-platform.namespace" . }}
  labels:
    {{- include "rag-platform.componentLabels" (dict "component" "postgres" "context" .) | nindent 4 }}
spec:
  schedule: {{ .Values.postgres.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: {{ .Values.postgres.backup.image }}
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="/backups/rag_platform_${TIMESTAMP}.sql.gz"

                  echo "Starting backup at ${TIMESTAMP}..."
                  pg_dump -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                    --no-owner --no-privileges | gzip > "${BACKUP_FILE}"

                  echo "Backup saved to ${BACKUP_FILE} ($(du -h ${BACKUP_FILE} | cut -f1))"

                  # Retention: delete backups older than configured days
                  find /backups -name "*.sql.gz" -mtime +{{ .Values.postgres.backup.retentionDays }} -delete
                  echo "Old backups cleaned. Remaining:"
                  ls -lh /backups/
              env:
                - name: POSTGRES_HOST
                  value: "postgres"
                - name: POSTGRES_DB
                  valueFrom:
                    configMapKeyRef:
                      name: {{ include "rag-platform.configMapName" . }}
                      key: POSTGRES_DB
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "rag-platform.secretName" . }}
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "rag-platform.secretName" . }}
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
              resources:
                {{- toYaml .Values.postgres.backup.resources | nindent 16 }}
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: postgres-backup-pvc
{{- end }}
