{{- if .Values.postgres.backup.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup-pvc
  namespace: {{ include "rag-platform.namespace" . }}
  labels:
    {{- include "rag-platform.componentLabels" (dict "component" "postgres" "context" .) | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.postgres.backup.storage.size }}
{{- end }}
