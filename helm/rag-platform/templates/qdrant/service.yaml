apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: {{ include "rag-platform.namespace" . }}
  labels:
    {{- include "rag-platform.labels" . | nindent 4 }}
    app: qdrant
spec:
  type: ClusterIP
  selector:
    app: qdrant
  ports:
    - name: rest
      port: {{ .Values.qdrant.restPort }}
      targetPort: rest
      protocol: TCP
    - name: grpc
      port: {{ .Values.qdrant.grpcPort }}
      targetPort: grpc
      protocol: TCP
