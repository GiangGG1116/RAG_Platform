apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: {{ include "rag-platform.namespace" . }}
  labels:
    {{- include "rag-platform.componentLabels" (dict "component" "rabbitmq" "context" .) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "rag-platform.selectorLabels" (dict "component" "rabbitmq") | nindent 4 }}
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
