apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: {{ include "rag-platform.namespace" . }}
  labels:
    {{- include "rag-platform.componentLabels" (dict "component" "rabbitmq" "context" .) | nindent 4 }}
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      {{- include "rag-platform.selectorLabels" (dict "component" "rabbitmq") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rag-platform.selectorLabels" (dict "component" "rabbitmq") | nindent 8 }}
    spec:
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image }}
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "rag-platform.secretName" . }}
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "rag-platform.secretName" . }}
                  key: RABBITMQ_PASSWORD
          volumeMounts:
            - name: rabbitmq-storage
              mountPath: /var/lib/rabbitmq
          resources:
            {{- toYaml .Values.rabbitmq.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: {{ .Values.rabbitmq.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.rabbitmq.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.rabbitmq.livenessProbe.timeoutSeconds }}
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: {{ .Values.rabbitmq.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.rabbitmq.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.rabbitmq.readinessProbe.timeoutSeconds }}
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.rabbitmq.storage.size }}
