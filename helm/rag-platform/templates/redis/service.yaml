apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ include "rag-platform.namespace" . }}
  labels:
    {{- include "rag-platform.componentLabels" (dict "component" "redis" "context" .) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "rag-platform.selectorLabels" (dict "component" "redis") | nindent 4 }}
  ports:
    - port: 6379
      targetPort: 6379
