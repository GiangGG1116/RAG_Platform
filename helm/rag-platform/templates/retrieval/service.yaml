apiVersion: v1
kind: Service
metadata:
  name: retrieval
  namespace: {{ include "rag-platform.namespace" . }}
  labels:
    {{- include "rag-platform.componentLabels" (dict "component" "retrieval" "context" .) | nindent 4 }}
spec:
  type: {{ .Values.retrieval.service.type }}
  selector:
    {{- include "rag-platform.selectorLabels" (dict "component" "retrieval") | nindent 4 }}
  ports:
    - port: {{ .Values.retrieval.service.port }}
      targetPort: {{ .Values.retrieval.port }}
