apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rag-platform.secretName" . }}
  namespace: {{ include "rag-platform.namespace" . }}
  labels:
    {{- include "rag-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
