apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: rag-platform
  labels:
    app: ingestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      containers:
        - name: ingestion
          image: rag-platform/ingestion:latest
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: rag-platform-config
            - secretRef:
                name: rag-platform-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: "ingestion-service"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion
  namespace: rag-platform
spec:
  type: ClusterIP
  selector:
    app: ingestion
  ports:
    - port: 8001
      targetPort: 8001
