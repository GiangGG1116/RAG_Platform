apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-service
  namespace: rag-platform
  labels:
    app: llm-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-service
  template:
    metadata:
      labels:
        app: llm-service
    spec:
      containers:
        - name: llm-service
          image: rag-platform/llm-service:latest
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: rag-platform-config
            - secretRef:
                name: rag-platform-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: "llm-service"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: llm-service
  namespace: rag-platform
spec:
  type: ClusterIP
  selector:
    app: llm-service
  ports:
    - port: 8003
      targetPort: 8003
