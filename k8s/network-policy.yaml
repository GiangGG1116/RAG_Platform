# ============================================================
# NetworkPolicy - Restrict traffic between services
# ============================================================

# --- Only API Gateway can receive external ingress traffic ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: rag-platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress: []
---
# Allow API Gateway to receive traffic from anywhere (external)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-gateway-ingress
  namespace: rag-platform
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8000
---
# Allow internal services to receive traffic from within the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-traffic
  namespace: rag-platform
spec:
  podSelector:
    matchLabels: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 5432   # postgres
        - port: 6379   # redis
        - port: 5672   # rabbitmq
        - port: 15672  # rabbitmq management
        - port: 8001   # ingestion
        - port: 8002   # retrieval
        - port: 8003   # llm-service
        - port: 4317   # otel grpc
        - port: 4318   # otel http
        - port: 8889   # otel prometheus
        - port: 9090   # prometheus
        - port: 3000   # grafana
