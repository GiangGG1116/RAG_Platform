# ============================================================
# PodDisruptionBudgets - Ensure availability during node drain
# ============================================================

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: rag-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: retrieval-pdb
  namespace: rag-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: retrieval
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ingestion-pdb
  namespace: rag-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ingestion
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker-pdb
  namespace: rag-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: worker
