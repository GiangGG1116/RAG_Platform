# ============================================================
# PostgreSQL Backup CronJob — Daily backup with retention
# ============================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: rag-platform
spec:
  schedule: "0 2 * * *"  # Every day at 2:00 AM UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:16-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="/backups/rag_platform_${TIMESTAMP}.sql.gz"

                  echo "Starting backup at ${TIMESTAMP}..."
                  pg_dump -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                    --no-owner --no-privileges | gzip > "${BACKUP_FILE}"

                  echo "Backup saved to ${BACKUP_FILE} ($(du -h ${BACKUP_FILE} | cut -f1))"

                  # Retention: delete backups older than 7 days
                  find /backups -name "*.sql.gz" -mtime +7 -delete
                  echo "Old backups cleaned. Remaining:"
                  ls -lh /backups/
              env:
                - name: POSTGRES_HOST
                  value: "postgres"
                - name: POSTGRES_DB
                  valueFrom:
                    configMapKeyRef:
                      name: rag-platform-config
                      key: POSTGRES_DB
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: rag-platform-secrets
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: rag-platform-secrets
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "250m"
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: postgres-backup-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup-pvc
  namespace: rag-platform
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
